# Place under /etc/nginx/sites-available/fileserver and enable.
# Replace footage.example.com and TLS paths (certbot recommended).

upstream fileserver_app {
    server 127.0.0.1:8080;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name footage.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name footage.example.com;

    ssl_certificate     /etc/letsencrypt/live/footage.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/footage.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Harden a bit at the edge.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    client_max_body_size 8m;

    location / {
        proxy_pass http://fileserver_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Important for video seeking.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
    }
}
